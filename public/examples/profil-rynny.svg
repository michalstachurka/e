<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="151mm"
  height="90.36mm"
  viewBox="-1 -1 152 91.36"
  data-units="mm"
  data-profile-type="linear-extrusion"
  data-origin-x="27.1"
  data-origin-y="83.86"
>
  <title>Przykładowy przekrój rynny 145,5 × 85,36 mm</title>
  <desc>
    Uproszczony profil demonstracyjny do wyciągnięcia w 3D. Jedna jednostka
    viewBox odpowiada jednemu milimetrowi. Nie jest to dokumentacja produkcyjna.
  </desc>

  <metadata>
    {
      "name": "Rynna demonstracyjna",
      "units": "mm",
      "overallWidth": 145.5,
      "insideBottomWidth": 116.9,
      "insideHeight": 78.86,
      "nominalThickness": 1.5,
      "origin": [27.1, 83.86]
    }
  </metadata>

  <!--
    Każdy element geometrii jest zamkniętym konturem. Importer powinien
    odczytać wyłącznie grupę #extrusion-profile i wyciągnąć jej ścieżki.
  -->
  <g id="extrusion-profile" fill="#171717" fill-rule="evenodd">
    <!-- Główny płaszcz rynny: lewa ścianka, dno i prawa ścianka. -->
    <path
      id="gutter-shell"
      d="M 17 5
         L 27.1 83.86
         L 144 83.86
         L 144 5
         L 145.5 5
         L 145.5 85.36
         L 25.6 85.36
         L 15.5 5.2
         Z"
    />

    <!-- Uproszczone zakończenie lewej krawędzi. -->
    <path
      id="left-lip"
      d="M 15.5 5.2
         L 10.5 5.2
         L 10.5 2.2
         L 7 2.2
         L 7 0.7
         L 17 0.7
         L 17 5
         Z"
    />

    <!-- Uproszczony zaczep prawej krawędzi. -->
    <path
      id="right-lip"
      d="M 144 5
         L 144 2.2
         L 139 2.2
         L 139 0.7
         L 145.5 0.7
         L 145.5 5
         L 149 5
         L 149 6.5
         L 147 6.5
         L 147 9.5
         L 145.5 9.5
         L 145.5 5
         Z"
    />
  </g>
</svg>
